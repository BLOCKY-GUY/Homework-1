<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Changing Numbers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }

        h1 {
            color: #333333;
            margin-bottom: 20px;
            font-size: 22px;
        }

        #number-display {
            font-size: 72px;
            color: #ff5722;
            font-weight: bold;
            margin-bottom: 30px;
        }

        button {
            width: 100%;
            padding: 12px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #ff5722;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e64a19;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Random Number</h1>
        <div id="number-display">1</div>
        <button id="toggle-btn">Stop</button>
    </div>

    <script>
        const numberDisplay = document.getElementById('number-display');
        const toggleBtn = document.getElementById('toggle-btn');

        let isRunning = true;
        let intervalId = setInterval(changeNumber, 200);

        function changeNumber() {
            const randomNum = Math.floor(Math.random() * 10) + 1;
            numberDisplay.textContent = randomNum;
        }

        toggleBtn.addEventListener('click', function () {
            if (isRunning) {
                clearInterval(intervalId);
                toggleBtn.textContent = "Start";
                isRunning = false;
            } else {
                intervalId = setInterval(changeNumber, 200);
                toggleBtn.textContent = "Stop";
                isRunning = true;
            }
        });
    </script>
</body>

</html>
