<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Slider</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>


    <div class="container mt-5">

        <h1 class="text-center mb-4">
            Nature Image Slider
        </h1>


        <!-- Slider -->
        <div id="natureSlider" class="carousel slide" data-bs-ride="carousel">


            <!-- Indicators -->
            <div class="carousel-indicators">

                <button type="button" data-bs-target="#natureSlider" data-bs-slide-to="0" class="active"></button>

                <button type="button" data-bs-target="#natureSlider" data-bs-slide-to="1"></button>

                <button type="button" data-bs-target="#natureSlider" data-bs-slide-to="2"></button>

            </div>


            <!-- Images -->
            <div class="carousel-inner">


                <div class="carousel-item active">
                    <img src="https://picsum.photos/900/400?random=1" class="d-block w-100 rounded" alt="Nature">
                </div>


                <div class="carousel-item">
                    <img src="https://picsum.photos/900/400?random=2" class="d-block w-100 rounded" alt="Forest">
                </div>


                <div class="carousel-item">
                    <img src="https://picsum.photos/900/400?random=3" class="d-block w-100 rounded" alt="Mountain">
                </div>


            </div>


            <!-- Previous Button -->
            <button class="carousel-control-prev" type="button" data-bs-target="#natureSlider" data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>


            <!-- Next Button -->
            <button class="carousel-control-next" type="button" data-bs-target="#natureSlider" data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>


        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
