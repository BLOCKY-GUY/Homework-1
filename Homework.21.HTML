<!DOCTYPE html>
<html>

<body>

    <h1>Methods and Loops</h1>
    <p>Using built-in JavaScript methods and loop concepts</p>

    <h3>1. A Random Set of Numbers (Loop)</h3>
    <p id="loopOutput"></p>

    <h3>2. Current Date and Time</h3>
    <p id="dateOutput"></p>

    <h3>3. Rounded Random Number</h3>
    <p id="roundOutput"></p>

    <script>
        var numbersList = "";
        for (var i = 0; i < 5; i++) {
            var randomItem = Math.floor(Math.random() * 100);
            numbersList += randomItem + " | ";
        }
        document.getElementById("loopOutput").innerHTML = numbersList;


        var currentDate = new Date();
        document.getElementById("dateOutput").innerHTML = "Today is: " + currentDate.toDateString();


        var preciseNumber = Math.random() * 10; // e.g., 7.342
        var roundedNumber = Math.round(preciseNumber); // Rounds it to the nearest whole number (e.g., 7)

        document.getElementById("roundOutput").innerHTML =
            "Original: " + preciseNumber + "<br>Rounded: " + roundedNumber;
    </script>

</body>

</html>
